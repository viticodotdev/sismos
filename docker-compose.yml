# Self-host on Coolify / any Docker host. No public domain required: the
# service reaches EMSC and your ntfy server outbound, and only needs
# the internal port. SELF_POLL=true makes the container poll on its own
# interval, so an external cron service is not needed.
#
# Usage:
#   cp .env.example .env   # fill in NTFY_* + port vars (REQIONS/MIN_MAGNITUDE optional)
#   docker compose up -d
#
# Coolify: add this repo as a Docker Compose deployment; set your env vars in
# the Coolify UI (or in this .env). No domain / proxy rewrite needed.

services:
  seismic-portal:
    build: .
    container_name: seismicportal-ntfy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container's internal port. The healthcheck below must match it.
      PORT: "${CONTAINER_PORT:-3000}"
      # Self-poll: the container drives its own cadence; no external cron.
      SELF_POLL: "true"
      POLL_INTERVAL_MINUTES: "5"
      # Ship real alerts by default in the container; flip to "1" to test.
      DRY_RUN: "0"
    ports:
      # Host port : container port. Change SEISMIC_PORT in .env if the host
      # port is already taken. Reach it at http://<host>:<SEISMIC_PORT>/health
      - "${SEISMIC_PORT:-3000}:${CONTAINER_PORT:-3000}"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:${CONTAINER_PORT:-3000}/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
